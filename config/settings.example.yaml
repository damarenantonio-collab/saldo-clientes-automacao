# Copie este arquivo para settings.yaml e ajuste os valores.
# settings.yaml NÃO é versionado (está no .gitignore) porque contém
# credenciais de e-mail e caminhos de arquivos locais.

# Caminho da planilha CONSOLIDADA de saldo em conta do escritório
# inteiro (ex: "Saldo_em_CC_BTG.xlsx", baixada manualmente por enquanto).
# Já traz o responsável (banker) de cada linha — dá pra ter quantos
# bankers precisar sem configuração extra, o banker_id de cada um é
# derivado do nome em "Responsável" (ex: "Eduardo Rego" -> "eduardo_rego")
# e precisa existir em bankers.csv. Veja config/saldos.example.xlsx pro
# formato esperado.
saldos_xlsx: "C:/Saldo/Saldo_em_CC_BTG.xlsx"

# A planilha de saldo tem duas abas com o mesmo formato — cada uma vira
# uma tabela separada no e-mail (Investimentos e Banking). Se um banker
# não tiver cliente numa das duas, a tabela correspondente é omitida.
saldos_sheet_investimentos: "Investimentos"
saldos_sheet_banking: "Banking"

# Só entram no e-mail contas com saldo POSITIVO a partir desse valor,
# OU saldo NEGATIVO (esses sempre entram, e aparecem em vermelho pra
# alertar). Saldos positivos abaixo desse valor (ex: R$ 0,00 a
# R$ 499,99 com o padrão 500) são descartados. Vale pras duas abas.
saldo_minimo: 500

# Caminho do arquivo com o mapeamento banker -> e-mail. Veja
# config/bankers.example.csv pro formato.
bankers_csv: "config/bankers.csv"

# Nome usado na assinatura do e-mail ("Att,\n<assinatura>").
assinatura: "Antonio Carvalho"

# Assunto do e-mail de saldo. {banker} e {data} são substituídos
# automaticamente (banker fica disponível mesmo não estando no template
# padrão, caso você queira reintroduzir no futuro).
assunto_template: "Saldo em Conta - {data}"

# --- Boletim de vencimentos (vencimentos_mensal.py) ---
# Caminho da planilha CONSOLIDADA de vencimentos de renda fixa do
# escritório (arquivo separado do saldo — ex: "Vencimentos_RF.xlsx").
# Mesmo princípio do saldo (banker derivado da coluna "Responsável").
vencimentos_xlsx: "C:/Saldo/Vencimentos_RF.xlsx"

# Aba da planilha de vencimentos.
vencimentos_sheet: "Export"

# Assunto do e-mail mensal de vencimentos. {mes_ano} é substituído
# automaticamente (ex: "Agosto/2026").
assunto_template_vencimentos: "Vencimentos do Mês - {mes_ano}"

# --- Boletim de vencimento de cartão de crédito (cartoes_vencimento.py) ---
# Caminho da planilha de CONTROLE de vencimento de fatura de cartão —
# diferente das outras duas, essa é mantida manualmente por você (não
# vem do BTG). Traz a coluna "Responsável" como as demais, então o
# boletim é multi-banker (um e-mail por banker). Veja
# config/cartoes.example.xlsx pro formato esperado.
cartoes_xlsx: "C:/Saldo/lembretes_cartoes.xlsx"

# Aba da planilha de cartões.
cartoes_sheet: "Clientes"

# Quantos dias antes do vencimento (e no próprio dia) o banker é
# avisado. Só é enviado e-mail quando há algum cliente dentro dessa
# janela — nos outros dias, nada é enviado.
cartoes_dias_aviso: 1

# Assunto do e-mail de aviso de cartão. {data} é substituído
# automaticamente pela data de hoje.
assunto_template_cartoes: "Vencimento de Fatura de Cartão - {data}"

# --- Envio de e-mail (SMTP) ---
email:
  # Servidor SMTP corporativo. Exemplo abaixo é o do Gmail com "senha de
  # app" (myaccount.google.com/apppasswords) — troque pelo SMTP da empresa
  # quando tiver os dados (host/porta/usuário/senha do provedor corporativo).
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  remetente: "relatorios@suaempresa.com.br"
  senha: "xxxx xxxx xxxx xxxx"

  # Modo teste: enquanto ativo=true, TODOS os e-mails (de todos os bankers)
  # são redirecionados para "enviar_para", com um aviso no topo do corpo
  # informando pra quem seria enviado de verdade. Use isso pra validar a
  # automação de ponta a ponta (SMTP incluso) SEM expor dados de clientes
  # pros bankers reais nem disparar e-mails de verdade pra eles.
  modo_teste:
    ativo: true
    enviar_para: "voce@suaempresa.com.br"

# E-mail(s) do(s) responsável(is) pela automação, avisado(s) em caso de
# falha na execução ou de banker sem e-mail cadastrado. Nunca inclui dados
# de clientes no corpo do alerta.
alerta_email:
  ativo: false
  para: "voce@suaempresa.com.br"

# Guarda um snapshot diário (por banker: quantidade de clientes e saldo
# total, SEM detalhe por cliente) em historico/, pra auditoria de que os
# e-mails foram enviados. Não é o mesmo que logar dados sensíveis (veja
# log_dados_sensiveis abaixo).
manter_historico: true
historico_path: "historico/envios_diarios.csv"

# Por padrão os logs de execução (logs/execucao.log) NÃO incluem nome de
# cliente, conta nem saldo — só contagens e nomes de banker, pra reduzir
# exposição de dado sensível em arquivo de log. Troque pra true só
# temporariamente, para depurar um problema específico.
log_dados_sensiveis: false
