# Copie este arquivo para settings.yaml e ajuste os valores.
# settings.yaml NÃO é versionado (está no .gitignore) porque contém
# credenciais de e-mail e caminhos de arquivos locais.

# Caminho do Excel de saldo em conta baixado do BTG (o mesmo arquivo que
# hoje você baixa manualmente do portal). Veja config/saldos.example.xlsx
# pro formato esperado.
saldos_xlsx: "C:/Saldo/Saldo_em_CC_BTG.xlsx"

# Aba do Excel que tem o saldo em conta corrente (não o patrimônio total).
saldos_sheet: "Saldo Diário"

# O BTG não exporta qual banker atende cada cliente — hoje todos os
# clientes do arquivo são deste banker_id (precisa existir em
# bankers.csv). Quando houver mais de um banker, troque isso por um
# mapeamento código de cliente -> banker_id (veja o README, seção
# "Múltiplos bankers").
banker_padrao: "seu_banker_id"

# Caminho do arquivo com o mapeamento banker -> e-mail. Veja
# config/bankers.example.csv pro formato.
bankers_csv: "config/bankers.csv"

# Nome usado na assinatura do e-mail ("Att,\n<assinatura>").
assinatura: "Antonio Carvalho"

# Assunto do e-mail nos dias normais. {banker} e {data} são substituídos
# automaticamente (banker fica disponível mesmo não estando no template
# padrão, caso você queira reintroduzir no futuro).
assunto_template: "Saldo em Conta - {data}"

# Assunto do e-mail no primeiro dia útil do mês, quando a seção de
# vencimentos entra junto (veja "vencimentos_sheet" abaixo). {data} é
# substituído automaticamente.
assunto_template_combinado: "Saldo em Conta e Vencimentos do Mês - {data}"

# --- Vencimentos de renda fixa ---
# Aba do Excel do BTG (mesmo arquivo do saldo, veja saldos_xlsx acima)
# com os vencimentos de renda fixa. No primeiro dia útil do mês, main.py
# lê essa aba e inclui os vencimentos do mês no mesmo e-mail do saldo —
# não é um envio separado. vencimentos_mensal.py só existe como
# ferramenta manual pra testar/pré-visualizar essa seção sem esperar o
# dia certo (veja o README).
vencimentos_sheet: "Vencimentos RF"

# Assunto usado só quando vencimentos_mensal.py roda manualmente (fora
# do fluxo automático). {mes_ano} é substituído automaticamente (ex:
# "Agosto/2026").
assunto_template_vencimentos: "Vencimentos do Mês - {mes_ano}"

# --- Envio de e-mail (SMTP) ---
email:
  # Servidor SMTP corporativo. Exemplo abaixo é o do Gmail com "senha de
  # app" (myaccount.google.com/apppasswords) — troque pelo SMTP da empresa
  # quando tiver os dados (host/porta/usuário/senha do provedor corporativo).
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  remetente: "relatorios@suaempresa.com.br"
  senha: "xxxx xxxx xxxx xxxx"

  # Modo teste: enquanto ativo=true, TODOS os e-mails (de todos os bankers)
  # são redirecionados para "enviar_para", com um aviso no topo do corpo
  # informando pra quem seria enviado de verdade. Use isso pra validar a
  # automação de ponta a ponta (SMTP incluso) SEM expor dados de clientes
  # pros bankers reais nem disparar e-mails de verdade pra eles.
  modo_teste:
    ativo: true
    enviar_para: "voce@suaempresa.com.br"

# E-mail(s) do(s) responsável(is) pela automação, avisado(s) em caso de
# falha na execução ou de banker sem e-mail cadastrado. Nunca inclui dados
# de clientes no corpo do alerta.
alerta_email:
  ativo: false
  para: "voce@suaempresa.com.br"

# Guarda um snapshot diário (por banker: quantidade de clientes e saldo
# total, SEM detalhe por cliente) em historico/, pra auditoria de que os
# e-mails foram enviados. Não é o mesmo que logar dados sensíveis (veja
# log_dados_sensiveis abaixo).
manter_historico: true
historico_path: "historico/envios_diarios.csv"

# Por padrão os logs de execução (logs/execucao.log) NÃO incluem nome de
# cliente, conta nem saldo — só contagens e nomes de banker, pra reduzir
# exposição de dado sensível em arquivo de log. Troque pra true só
# temporariamente, para depurar um problema específico.
log_dados_sensiveis: false
